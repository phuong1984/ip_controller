<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Robot Controller</title>
<style>
  :root {
    --bg-color: #b3b2e9;
    --btn-border: #000000;
    --screen-bg: #a3e691;
    --analog-bg: #4a4f61;
    --analog-knob: #1a1d28;
    --danger: #ff5d5d;
    --ok: #59d97a;
  }
  
  * {
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
    user-select: none;
  }

  html, body {
    width: 100vw;
    height: 100dvh;
    margin: 0;
    padding: 0;
    background: var(--bg-color);
    overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  @media screen and (orientation: portrait) and (max-width: 1024px) {
    #viewport {
      position: absolute;
      width: 100dvh !important;
      height: 100vw !important;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      transform-origin: center center;
    }
  }

  #viewport {
    width: 100vw;
    height: 100dvh;
    padding: 8px 12px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #controller {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 980px;
    max-height: 460px;
    --stage-height-limit: min(200px, 44vh);
  }

  #status {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    padding: 3px 10px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.15);
    font-size: min(11px, 2.2vh);
    font-weight: bold;
    color: #000;
    z-index: 20;
    white-space: nowrap;
  }
  #status span { display: flex; align-items: center; gap: 4px; }
  .camera-ip-button {
    padding: 0;
    color: inherit;
    font: inherit;
    background: none;
    border: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  .camera-ip-button:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); display: inline-block; transition: background 0.3s; }
  .dot.ok { background: var(--ok); }

  #stage {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    width: min(340px, 40vw);
    height: var(--stage-height-limit);
    background: var(--screen-bg);
    border: 3px solid var(--btn-border);
    overflow: hidden;
    z-index: 5;
    border-radius: 4px;
  }

  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; visibility: hidden; }

  #cam-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    font-size: min(12px, 2.5vh);
    font-weight: bold;
    text-align: center;
    padding: 6px;
  }
  #cam-fallback.hidden { display: none; }

  .btn {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    font-weight: 900;
    touch-action: none;
    cursor: pointer;
    background: transparent;
    transition: transform 0.05s ease, opacity 0.05s ease;
  }

  #dpad, #faces {
    position: absolute;
    top: min(50px, 12vh);
    width: min(165px, 34vw, 42vh);
    height: min(165px, 34vw, 42vh);
  }
  #dpad { left: 0; }
  #faces { right: 0; }

  .shoulder-group {
    position: absolute;
    top: 0;
    display: flex;
    gap: 12px;
  }
  
  #shoulders-l {
    left: calc(min(165px, 34vw, 42vh) / 2);
    transform: translateX(-50%);
  }

  #shoulders-r {
    right: calc(min(165px, 34vw, 42vh) / 2);
    transform: translateX(50%);
    flex-direction: row-reverse;
  }

  .btn.shoulder {
    position: relative;
    width: min(65px, 14vw);
    height: min(34px, 8.5vh);
    border: 3px solid var(--btn-border);
    font-size: min(16px, 3.2vh);
    background: transparent;
    border-radius: 4px;
  }
  .btn.shoulder:active, .btn.shoulder.active {
    transform: scale(0.92);
    opacity: 0.7;
  }

  .btn.side-control {
    --side-control-width: min(78px, 16.8vw);
    width: var(--side-control-width);
    height: min(34px, 8.5vh);
    border: 3px solid var(--btn-border);
    border-radius: 4px;
    font-size: min(16px, 3.2vh);
    transform: translate(-50%, -50%);
  }
  #share {
    top: calc(28px + var(--stage-height-limit) + 12px + min(90px, 20vw, 20vh) / 2);
    left: calc(min(165px, 34vw, 42vh) / 2);
  }
  #options {
    top: calc(28px + var(--stage-height-limit) + 12px + min(90px, 20vw, 20vh) / 2);
    right: calc(min(165px, 34vw, 42vh) / 2 - var(--side-control-width) / 2);
    transform: translateY(-50%);
  }
  .btn.side-control:active, .btn.side-control.active {
    transform: translate(-50%, -50%) scale(0.92);
    opacity: 0.7;
  }
  #options:active, #options.active {
    transform: translateY(-50%) scale(0.92);
  }

  @media screen and (max-width: 600px) and (orientation: portrait) {
    .btn.side-control {
      --side-control-width: min(53px, 13.8vw);
      font-size: 11px;
    }
  }
  @media screen and (orientation: portrait) and (max-width: 1024px) {
    #controller { --stage-height-limit: min(200px, 44vw); }
    #stage { width: min(340px, 40dvh); }
  }
  @media screen and (max-width: 360px) and (orientation: portrait) {
    .btn.side-control {
      font-size: 9px;
    }
  }

  #dpad .btn, #faces .btn {
    width: 32%;
    height: 32%;
    border-radius: 50%;
    border: 3.5px solid var(--btn-border);
  }

  .up    { top: 0; left: 50%; transform: translateX(-50%); }
  .down  { bottom: 0; left: 50%; transform: translateX(-50%); }
  .left  { top: 50%; left: 0; transform: translateY(-50%); }
  .right { top: 50%; right: 0; transform: translateY(-50%); }

  .up:active, .up.active       { transform: translateX(-50%) scale(0.9); opacity: 0.7; }
  .down:active, .down.active   { transform: translateX(-50%) scale(0.9); opacity: 0.7; }
  .left:active, .left.active   { transform: translateY(-50%) scale(0.9); opacity: 0.7; }
  .right:active, .right.active { transform: translateY(-50%) scale(0.9); opacity: 0.7; }

  .btn svg {
    width: 60%;
    height: 60%;
    stroke: #000;
    stroke-width: 3.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }

  .joystick {
    position: absolute;
    top: calc(28px + var(--stage-height-limit) + 12px);
    width: min(90px, 20vw, 20vh);
    height: min(90px, 20vw, 20vh);
    border-radius: 50%;
    background: var(--analog-bg);
    touch-action: none;
  }
  #joy-left { left: calc(50% - min(100px, 14vw)); transform: translateX(-50%); }
  #joy-right { left: calc(50% + min(100px, 14vw)); transform: translateX(-50%); }

  .knob {
    position: absolute;
    width: 50%;
    height: 50%;
    border-radius: 50%;
    background: var(--analog-knob);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .settings-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(8, 12, 24, 0.62);
  }
  .settings-overlay[hidden] { display: none; }
  .settings-panel {
    width: min(100%, 420px);
    padding: 24px;
    color: #111827;
    background: #fff;
    border: 2px solid var(--btn-border);
    border-radius: 14px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.28);
  }
  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }
  .settings-header h1 {
    margin: 0;
    font-size: 20px;
  }
  #close-camera-settings {
    width: 36px;
    height: 36px;
    padding: 0;
    font-size: 24px;
    line-height: 1;
    color: inherit;
    background: transparent;
    border: 0;
    cursor: pointer;
  }
  .settings-field {
    display: grid;
    gap: 7px;
    margin-bottom: 16px;
    font-size: 14px;
    font-weight: 700;
  }
  .settings-field input {
    width: 100%;
    min-height: 44px;
    padding: 9px 11px;
    font: inherit;
    font-size: 16px;
    user-select: text;
    border: 1px solid #7b8190;
    border-radius: 7px;
  }
  #camera-url-preview {
    display: block;
    overflow-wrap: anywhere;
    margin: 2px 0 16px;
    color: #374151;
    font-size: 13px;
  }
  #camera-settings-error {
    min-height: 20px;
    margin: 0 0 12px;
    color: #b42318;
    font-size: 13px;
  }
  .settings-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .settings-actions button {
    min-height: 42px;
    padding: 8px 16px;
    font: inherit;
    font-weight: 700;
    border: 1px solid #343a46;
    border-radius: 7px;
    cursor: pointer;
  }
  #cancel-camera-settings { background: #fff; }
  #save-camera-settings { color: #fff; background: #263648; }

  @media (max-width: 480px) {
    .settings-panel { padding: 20px; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    .settings-overlay { padding: 8px; }
    .settings-panel { padding: 10px 18px; }
    .settings-header { margin-bottom: 10px; }
    .settings-header h1 { font-size: 18px; }
    .settings-field { gap: 4px; margin-bottom: 8px; }
    .settings-field input { min-height: 38px; }
    #camera-url-preview { margin: 0 0 8px; }
    #camera-settings-error { min-height: 16px; margin-bottom: 4px; }
    .settings-actions button { min-height: 36px; }
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="controller">
    <div id="status">
      <span><span class="dot" id="dot-cam"></span>CAM <button class="camera-ip-button" id="ip-cam" type="button" aria-label="Thay đổi địa chỉ camera"></button></span>
      <span><span class="dot" id="dot-robot"></span>ROBOT <span id="ip-robot"></span></span>
    </div>

    <div id="stage">
      <img id="cam" alt="camera stream">
      <div id="cam-fallback">Đang kết nối camera...</div>
    </div>

    <div class="shoulder-group" id="shoulders-l">
      <div class="btn shoulder" data-btn="l2">L2</div>
      <div class="btn shoulder" data-btn="l1">L1</div>
    </div>

    <div class="shoulder-group" id="shoulders-r">
      <div class="btn shoulder" data-btn="r2">R2</div>
      <div class="btn shoulder" data-btn="r1">R1</div>
    </div>

    <div id="dpad">
      <div class="btn up" data-btn="dpad_up"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
      <div class="btn down" data-btn="dpad_down"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></div>
      <div class="btn left" data-btn="dpad_left"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>
      <div class="btn right" data-btn="dpad_right"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
    </div>
    <div class="btn side-control" id="share" data-btn="share">Share</div>

    <div id="faces">
      <div class="btn up" data-btn="triangle"><svg viewBox="0 0 24 24"><polygon points="12 4 3 20 21 20"/></svg></div>
      <div class="btn left" data-btn="square"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/></svg></div>
      <div class="btn right" data-btn="circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></div>
      <div class="btn down" data-btn="cross"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    </div>
    <div class="btn side-control" id="options" data-btn="options">Options</div>

    <div class="joystick" id="joy-left"><div class="knob"></div></div>
    <div class="joystick" id="joy-right"><div class="knob"></div></div>
  </div>
</div>
<div id="camera-settings-overlay" class="settings-overlay" hidden>
  <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="camera-settings-title">
    <div class="settings-header">
      <h1 id="camera-settings-title">Cài đặt camera</h1>
      <button id="close-camera-settings" type="button" aria-label="Đóng">&times;</button>
    </div>
    <form id="camera-settings-form">
      <label class="settings-field" for="camera-ip-input">
        Địa chỉ IP camera
        <input id="camera-ip-input" name="cameraIp" type="text" inputmode="decimal" autocomplete="off" placeholder="192.168.1.49" required>
      </label>
      <label class="settings-field" for="camera-port-input">
        Cổng stream
        <input id="camera-port-input" name="cameraPort" type="number" inputmode="numeric" min="1" max="65535" step="1" placeholder="81" required>
      </label>
      <output id="camera-url-preview"></output>
      <p id="camera-settings-error" role="alert" aria-live="polite"></p>
      <div class="settings-actions">
        <button id="cancel-camera-settings" type="button">Hủy</button>
        <button id="save-camera-settings" type="submit">Lưu</button>
      </div>
    </form>
  </section>
</div>

<script>
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSoundPress() {
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square"; 
  osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.05);
  gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

function playSoundRelease() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(450, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
  gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.04);
}

function isMobileDevice() {
  const userAgent = navigator.userAgent || "";
  const mobileUserAgent = /Android|iPhone|iPad|iPod|Mobile/i.test(userAgent);
  const touchMac = /Macintosh/i.test(userAgent) && navigator.maxTouchPoints > 1;
  return navigator.userAgentData?.mobile === true || mobileUserAgent || touchMac;
}

async function enableLandscapeMode() {
  if (!isMobileDevice()) return;

  try {
    const root = document.documentElement;
    const requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
    const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

    if (!isFullscreen && requestFullscreen) await requestFullscreen.call(root);
    if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape");
  } catch (err) {}
}

window.addEventListener("pointerdown", () => {
  initAudio();
  enableLandscapeMode();
}, { once: true });


const ROBOT_IP   = "192.168.1.50";
const JOYSTICK_SEND_INTERVAL_MS = 300;
const DEFAULT_CAMERA_IP = "192.168.1.49";
const DEFAULT_CAMERA_PORT = 81;
const CAMERA_SETTINGS_KEY = "fpvIpControllerCameraSettings";

document.getElementById("ip-robot").textContent = ROBOT_IP;

const camImg = document.getElementById("cam");
const camFallback = document.getElementById("cam-fallback");
const stage = document.getElementById("stage");
const share = document.getElementById("share");
const options = document.getElementById("options");
const dotCam = document.getElementById("dot-cam");
const cameraIpButton = document.getElementById("ip-cam");
const cameraSettingsOverlay = document.getElementById("camera-settings-overlay");
const cameraSettingsForm = document.getElementById("camera-settings-form");
const cameraIpInput = document.getElementById("camera-ip-input");
const cameraPortInput = document.getElementById("camera-port-input");
const cameraUrlPreview = document.getElementById("camera-url-preview");
const cameraSettingsError = document.getElementById("camera-settings-error");

let cameraIp = DEFAULT_CAMERA_IP;
let cameraPort = DEFAULT_CAMERA_PORT;
let cameraReachable = null;
let cameraRetryTimer = null;

try {
  const savedSettings = JSON.parse(localStorage.getItem(CAMERA_SETTINGS_KEY) || "null");
  if (savedSettings && isValidCameraIp(savedSettings.ip) && isValidCameraPort(savedSettings.port)) {
    cameraIp = savedSettings.ip;
    cameraPort = Number(savedSettings.port);
  }
} catch (error) {
  console.warn("Không đọc được cài đặt camera đã lưu.", error);
}

function isValidCameraIp(value) {
  if (typeof value !== "string") return false;
  const octets = value.trim().split(".");
  return octets.length === 4 && octets.every(octet =>
    /^\d{1,3}$/.test(octet) && Number(octet) >= 0 && Number(octet) <= 255
  );
}

function isValidCameraPort(value) {
  const port = Number(value);
  return Number.isInteger(port) && port >= 1 && port <= 65535;
}

function cameraStreamUrl() {
  return `http://${cameraIp}:${cameraPort}/stream`;
}

function updateCameraSettingsForm() {
  cameraIpInput.value = cameraIp;
  cameraPortInput.value = cameraPort;
  cameraUrlPreview.textContent = cameraStreamUrl();
  document.getElementById("ip-cam").textContent = `${cameraIp}:${cameraPort}`;
}

function startStream() {
  clearTimeout(cameraRetryTimer);
  cameraRetryTimer = null;
  camImg.style.visibility = "hidden";
  camFallback.textContent = "Đang kết nối camera...";
  camFallback.classList.remove("hidden");
  camImg.src = cameraStreamUrl() + "?t=" + Date.now();
}

function setCameraConnection(connected) {
  if (cameraReachable === connected) return;
  cameraReachable = connected;
  dotCam.classList.toggle("ok", connected);

  if (!connected) {
    camImg.style.visibility = "hidden";
    camFallback.textContent = "Mất kết nối camera";
    camFallback.classList.remove("hidden");
    return;
  }

  camImg.style.visibility = "visible";
  camFallback.classList.add("hidden");
}

camImg.onload = () => {
  setCameraConnection(true);
};

camImg.onerror = () => {
  setCameraConnection(false);
  if (cameraRetryTimer === null) {
    cameraRetryTimer = setTimeout(startStream, 2000);
  }
};

const STAGE_TOP = 28;
let stageFitKey = "";
let stagePollTimer = null;

function applyStageFit(displayWidth, displayHeight) {
  if (!displayWidth || !displayHeight) return;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const portrait = matchMedia("(orientation: portrait) and (max-width: 1024px)").matches;
  const maxW = Math.min(340, (portrait ? vh : vw) * 0.40);
  const maxH = Math.min(200, (portrait ? vw : vh) * 0.44);
  const aspect = displayWidth / displayHeight;
  let w = maxW;
  let h = maxW / aspect;
  if (h > maxH) {
    h = maxH;
    w = maxH * aspect;
  }
  w = Math.round(w);
  h = Math.round(h);
  stage.style.width = `${w}px`;
  stage.style.height = `${h}px`;
  const halfButton = Math.min(90, vw * 0.20, vh * 0.20) / 2;
  const buttonTop = Math.round(STAGE_TOP + h + 12 + halfButton);
  share.style.top = `${buttonTop}px`;
  options.style.top = `${buttonTop}px`;
}

function fitStageToStream() {
  fetch(`http://${cameraIp}:${cameraPort}/status`)
    .then(response => (response.ok ? response.json() : null))
    .then(status => {
      if (!status || status.running === false || !status.displayWidth || !status.displayHeight) return;
      const nextFitKey = [
        status.displayWidth,
        status.displayHeight,
        window.innerWidth,
        window.innerHeight,
        matchMedia("(orientation: portrait) and (max-width: 1024px)").matches,
      ].join("x");
      if (nextFitKey === stageFitKey) return;
      stageFitKey = nextFitKey;
      applyStageFit(status.displayWidth, status.displayHeight);
    })
    .catch(() => {});
}

function startStagePolling() {
  clearInterval(stagePollTimer);
  fitStageToStream();
  stagePollTimer = setInterval(fitStageToStream, 1000);
}

window.addEventListener("resize", fitStageToStream);

updateCameraSettingsForm();
startStream();
startStagePolling();

function openCameraSettings() {
  updateCameraSettingsForm();
  cameraSettingsError.textContent = "";
  cameraSettingsOverlay.hidden = false;
  cameraIpInput.focus();
}

function closeCameraSettings() {
  cameraSettingsOverlay.hidden = true;
  cameraIpButton.focus();
}

cameraIpButton.addEventListener("click", openCameraSettings);
document.getElementById("close-camera-settings").addEventListener("click", closeCameraSettings);
document.getElementById("cancel-camera-settings").addEventListener("click", closeCameraSettings);
cameraSettingsOverlay.addEventListener("click", event => {
  if (event.target === cameraSettingsOverlay) closeCameraSettings();
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !cameraSettingsOverlay.hidden) closeCameraSettings();
});

cameraIpInput.addEventListener("input", () => {
  cameraUrlPreview.textContent = `http://${cameraIpInput.value.trim()}:${cameraPortInput.value}/stream`;
});
cameraPortInput.addEventListener("input", () => {
  cameraUrlPreview.textContent = `http://${cameraIpInput.value.trim()}:${cameraPortInput.value}/stream`;
});

cameraSettingsForm.addEventListener("submit", event => {
  event.preventDefault();
  const nextIp = cameraIpInput.value.trim();
  const nextPort = Number(cameraPortInput.value);
  if (!isValidCameraIp(nextIp)) {
    cameraSettingsError.textContent = "Hãy nhập địa chỉ IPv4 hợp lệ.";
    cameraIpInput.focus();
    return;
  }
  if (!isValidCameraPort(nextPort)) {
    cameraSettingsError.textContent = "Cổng phải là số nguyên từ 1 đến 65535.";
    cameraPortInput.focus();
    return;
  }

  try {
    localStorage.setItem(CAMERA_SETTINGS_KEY, JSON.stringify({ ip: nextIp, port: nextPort }));
  } catch (error) {
    cameraSettingsError.textContent = "Không lưu được cài đặt trong trình duyệt.";
    console.error("Không lưu được cài đặt camera.", error);
    return;
  }

  cameraIp = nextIp;
  cameraPort = nextPort;
  cameraReachable = null;
  dotCam.classList.remove("ok");
  updateCameraSettingsForm();
  closeCameraSettings();
  startStream();
});

const dotRobot = document.getElementById("dot-robot");

function sendToRobot(path){
  return fetch(`http://${ROBOT_IP}${path}`, { mode: "cors" });
}

const joystickStats = { sampled: 0, sent: 0, replied: 0, retries: 0, failed: 0 };
const controlQueue = [];
let controlSending = false;
let nextControlSeq = Date.now();
let joystickStatsTick = performance.now();
setInterval(() => {
  const now = performance.now();
  const elapsed = Math.round(now - joystickStatsTick);
  if (joystickStats.sampled || joystickStats.sent || joystickStats.replied || joystickStats.failed) {
    const queued = controlQueue.length + (controlSending ? 1 : 0);
    console.info(`[joy/${elapsed}ms] sampled=${joystickStats.sampled} sent=${joystickStats.sent} replied=${joystickStats.replied} retries=${joystickStats.retries} failed=${joystickStats.failed} queued=${queued}`);
  }
  joystickStats.sampled = 0;
  joystickStats.sent = 0;
  joystickStats.replied = 0;
  joystickStats.retries = 0;
  joystickStats.failed = 0;
  joystickStatsTick = now;
}, 1000);

function enqueueControl(path, isJoystick = false){
  controlQueue.push({ path, isJoystick });
  pumpControlQueue();
}

function queueButton(name, state){
  const seq = ++nextControlSeq;
  enqueueControl(`/button?name=${name}&state=${state}&seq=${seq}`);
}

async function pumpControlQueue(){
  if (controlSending || controlQueue.length === 0) return;
  controlSending = true;
  const item = controlQueue.shift();
  let retry = false;
  try {
    if (item.isJoystick) joystickStats.sent++;
    const response = await sendToRobot(item.path);
    if (response.status === 503 || response.status >= 500) {
      retry = true;
      if (item.isJoystick) joystickStats.retries++;
    } else if (response.ok) {
      if (item.isJoystick) joystickStats.replied++;
    } else if (item.isJoystick) {
      joystickStats.failed++;
    }
  } catch (error) {
    retry = true;
    if (item.isJoystick) joystickStats.retries++;
  } finally {
    if (retry) controlQueue.unshift(item);
    controlSending = false;
    if (controlQueue.length) setTimeout(pumpControlQueue, retry ? 30 : 0);
  }
}

function pingRobot(){
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 2000);

  fetch(`http://${ROBOT_IP}/ping`, { mode: "cors", signal: controller.signal })
    .then((res) => {
      clearTimeout(timeoutId);
      if (res.ok) dotRobot.classList.add("ok");
      else dotRobot.classList.remove("ok");
    })
    .catch(() => {
      clearTimeout(timeoutId);
      dotRobot.classList.remove("ok");
    });
}

pingRobot();
setInterval(pingRobot, 3000);

// NÚT BẤM
document.querySelectorAll("[data-btn]").forEach(el => {
  const name = el.dataset.btn;
  let isPressed = false;
  let activePointerId = null;

  const press = (e) => {
    e.preventDefault();
    if (isPressed) return;
    isPressed = true;
    activePointerId = e.pointerId;
    try { el.setPointerCapture(activePointerId); } catch(err) {}

    el.classList.add("active");
    playSoundPress();
    queueButton(name, "down");
  };

  const release = (e) => {
    if (e) e.preventDefault();
    if (!isPressed) return;

    isPressed = false;
    activePointerId = null;
    
    el.classList.remove("active");
    playSoundRelease();
    queueButton(name, "up");
  };

  el.addEventListener("pointerdown", press);
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
});

// JOYSTICK (ĐÃ KHẮC PHỤC HOÀN TOÀN LỖI DỰ DƯ BỘ ĐẾM VÀ GỬI DỮ LIỆU)
function setupJoystick(containerId, joyId){
  const container = document.getElementById(containerId);
  const knob = container.querySelector(".knob");

  let dragging = false;
  let currentX = 0;
  let currentY = 0;
  let loopInterval = null;

  function updateKnob(dx, dy){
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }

  function sendJoystick(x, y){
    const seq = ++nextControlSeq;
    joystickStats.sampled++;
    enqueueControl(`/joystick?id=${joyId}&x=${x}&y=${y}&seq=${seq}`, true);
  }

  function handleMove(clientX, clientY){
    const rect = container.getBoundingClientRect();
    const radius = rect.width / 2;
    const cx = rect.left + radius;
    const cy = rect.top + radius;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist > radius){
      dx = (dx / dist) * radius;
      dy = (dy / dist) * radius;
    }
    updateKnob(dx, dy);

    currentX = Math.round((dx / radius) * 100);
    currentY = Math.round((-dy / radius) * 100);
  }

  function stopLoop() {
    if (loopInterval) {
      clearInterval(loopInterval);
      loopInterval = null;
    }
  }

  container.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    dragging = true;
    try { container.setPointerCapture(e.pointerId); } catch(err) {}

    handleMove(e.clientX, e.clientY);
    sendJoystick(currentX, currentY);

    stopLoop();
    loopInterval = setInterval(() => {
      if (dragging) {
        sendJoystick(currentX, currentY);
      }
    }, JOYSTICK_SEND_INTERVAL_MS);
  });

  window.addEventListener("pointermove", (e) => {
    if(!dragging) return;
    handleMove(e.clientX, e.clientY);
  });

  function endDrag(){
    if(!dragging) return;
    dragging = false;

    stopLoop();

    currentX = 0;
    currentY = 0;
    updateKnob(0, 0);

    sendJoystick(0, 0);
  }

  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);
}

setupJoystick("joy-left", "left");
setupJoystick("joy-right", "right");
